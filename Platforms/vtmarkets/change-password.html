<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change your password · VT Markets</title>
  <style>
    :root { --blue:#1434CB; --bg:#0b1220; --card:#111a2e; --text:#e6edf7; --muted:#8ea0bd; --err:#ff4d4f; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Arial,sans-serif; background:var(--bg); color:var(--text);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { background:var(--card); border:1px solid #1e2b45; border-radius:16px; padding:32px; width:100%; max-width:420px; }
    h1 { font-size:22px; margin:0 0 6px; }
    p.sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
    label { display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; }
    input { width:100%; padding:12px 14px; border-radius:9px; border:1px solid #26344f; background:#0d1526; color:var(--text); font-size:14px; }
    input:focus { outline:none; border-color:var(--blue); }
    button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:10px; background:var(--blue);
             color:#fff; font-weight:700; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:16px; font-size:13px; }
    .msg.err { color:var(--err); }
    .msg.ok { color:#22c55e; }
    .brand { font-weight:800; letter-spacing:.5px; margin-bottom:20px; color:#fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">VT&nbsp;MARKETS</div>
    <h1>Change your password</h1>
    <p class="sub" id="sub">Choose a new password for your account.</p>

    <label for="cur">Current password</label>
    <input id="cur" type="password" autocomplete="current-password" />
    <label for="pw">New password</label>
    <input id="pw" type="password" placeholder="At least 8 characters" autocomplete="new-password" />
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" />
    <button id="submit">Update password</button>
    <div id="msg" class="msg"></div>
  </div>

  <script src="homesubfiles/api-client.js?v=1"></script>
  <script>
    (function () {
      if (!window.VTAuth || !window.VTAuth.isAuthed()) { window.location.replace('login.html'); return; }
      var msg = document.getElementById('msg');
      var btn = document.getElementById('submit');

      // When redirected here because an admin set a temporary password.
      if (new URLSearchParams(location.search).get('forced') === '1') {
        document.getElementById('sub').textContent =
          'Your account was set up with a temporary password. Please choose your own to continue.';
      }

      btn.addEventListener('click', function () {
        var cur = document.getElementById('cur').value;
        var pw = document.getElementById('pw').value;
        var pw2 = document.getElementById('pw2').value;
        msg.className = 'msg'; msg.textContent = '';

        if (!cur) { msg.className = 'msg err'; msg.textContent = 'Enter your current password.'; return; }
        if (pw.length < 8) { msg.className = 'msg err'; msg.textContent = 'New password must be at least 8 characters.'; return; }
        if (pw !== pw2) { msg.className = 'msg err'; msg.textContent = 'Passwords do not match.'; return; }

        btn.disabled = true; btn.textContent = 'Updating…';
        window.VTApi.post('/api/me/change-password', { current_password: cur, new_password: pw }, true)
          .then(function () {
            msg.className = 'msg ok';
            msg.textContent = 'Password updated. Redirecting…';
            setTimeout(function () { window.location.href = 'home.html'; }, 900);
          })
          .catch(function (err) {
            btn.disabled = false; btn.textContent = 'Update password';
            msg.className = 'msg err';
            msg.textContent = (err && err.message) || 'Could not update password.';
          });
      });
    })();
  </script>
</body>
</html>
